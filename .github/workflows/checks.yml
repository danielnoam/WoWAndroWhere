name: Checks

# Pull requests: unit tests and a build check, without secrets. Releases come from release.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
      - name: Fetch runtime components
        run: tools/fetch_components.sh
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: ./gradlew --no-daemon testModernDebugUnitTest --tests "app.gamenative.wow.legacy.*" --tests "app.gamenative.wow.solo.*" --tests "app.gamenative.ui.screen.wow.*" --tests "app.gamenative.utils.AppUpdaterTest" --tests "app.gamenative.wow.addons.AddonArchiveTest" --tests "app.gamenative.wow.addons.AddonTargetTest" --tests "app.gamenative.wow.addons.CurseForgeAccessTest"
      - name: Build
        run: ./gradlew --no-daemon assembleModernDebug
