name: README screenshots

# Renders the launcher's screens with a sample 3.3.5a profile (ReadmeScreenshots) and commits them to
# .github/readme/app/ on the branch it runs on. Runs by hand, or on a branch push that changes the renderer.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - app/src/test/java/app/gamenative/wow/readme/**
      - .github/workflows/readme-screens.yml

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the NDK
        run: |
          NDK=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null
      - name: Fetch runtime components
        run: tools/fetch_components.sh
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Render
        run: ./gradlew --no-daemon testModernDebugUnitTest --tests "app.gamenative.wow.readme.ReadmeScreenshots"
      - name: Show the test's output
        if: failure()
        run: grep -h -A60 -E "Exception|Error" app/build/test-results/testModernDebugUnitTest/*.xml | head -400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-screens
          path: |
            app/build/readme-screens/
            app/build/reports/tests/
      - name: Commit
        run: |
          mkdir -p .github/readme/app
          cp app/build/readme-screens/*.png .github/readme/app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/readme/app
          git diff --cached --quiet || git commit -m "README screenshots from ${GITHUB_SHA::7}"
          git push
